<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- status -->

    <div id="networkBanner" hidden role="status">
      You are offline. Some features may not work.
    </div>

    <div class="card">
      <span>Sale</span>
      <!-- product image -->
      <img src="./image/images.jpg" alt="Burger" />
      <!-- product description -->
      <div>
        <h4>Cheese Burger</h4>
        <p>$49.99</p>
        <button>Add to cart</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
